<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FIN & FRIENDS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <!-- =========================================
             HEADER
        ========================================== -->

        <header class="header">

            <div class="logo">

                <div class="logo-small">
                    PIXEL AQUARIUM
                </div>

                <div class="logo-big">
                    FIN
                </div>

                <div class="logo-big second">
                    &amp; FRIENDS
                </div>

            </div>

            <div class="day-box">

                <div class="day-label">
                    DAY
                </div>

                <div
                    id="day"
                    class="day-number"
                >
                    1
                </div>

                <div
                    id="timeLabel"
                    class="clock"
                >
                    08:00
                </div>

            </div>

        </header>


        <!-- =========================================
             MAIN GAME
        ========================================== -->

        <main class="game-screen">


            <!-- =====================================
                 AQUARIUM
            ====================================== -->

            <section
                id="aquarium"
                class="aquarium"
            >

                <div class="water-pixels"></div>


                <!-- BUBBLES -->

                <div class="bubble bubble1"></div>
                <div class="bubble bubble2"></div>
                <div class="bubble bubble3"></div>
                <div class="bubble bubble4"></div>
                <div class="bubble bubble5"></div>


                <!-- CASTLE -->

                <div class="castle">

                    <div class="castle-top"></div>

                    <div class="castle-body">

                        <div class="castle-window"></div>

                        <div class="castle-window"></div>

                    </div>

                </div>


                <!-- PLANTS -->

                <div class="plant plant1">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="plant plant2">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <!-- SAND -->

                <div class="sand"></div>


                <!-- =================================
                     FISH
                ================================== -->

                <div
                    id="fish"
                    class="fish-container"
                >

                    <div class="fish-shadow"></div>

                    <div class="fish">

                        <div class="fish-tail"></div>

                        <div class="fish-body">

                            <div class="fish-fin-top"></div>

                            <div class="fish-fin-bottom"></div>

                            <div class="fish-eye">
                                <span></span>
                            </div>

                            <div class="fish-cheek"></div>

                            <div class="fish-scale scale1"></div>
                            <div class="fish-scale scale2"></div>
                            <div class="fish-scale scale3"></div>

                            <div
                                id="fishMouth"
                                class="fish-mouth"
                            ></div>

                        </div>

                    </div>

                </div>


                <!-- =================================
                     FOOD TRAY
                ================================== -->

                <div
                    id="foodTray"
                    class="food-tray hidden"
                >

                    <div class="food-title">
                        FOOD!
                    </div>

                    <div class="food-subtitle">
                        CLICK A SNACK
                    </div>

                    <div
                        id="foodPieces"
                        class="food-pieces"
                    ></div>

                </div>


                <!-- FOOD MESSAGE -->

                <div
                    id="foodMessage"
                    class="food-message hidden"
                >
                    CHOOSE FOOD
                </div>


                <!-- SPEECH -->

                <div
                    id="speech"
                    class="speech"
                >
                    HELLO!
                </div>


                <!-- STATUS -->

                <div class="status-bar">

                    <div
                        id="moodIcon"
                        class="status-face"
                    >
                        ♥
                    </div>

                    <div class="status-text">

                        <strong id="moodText">
                            HAPPY
                        </strong>

                        <span id="statusText">
                            READY TO PLAY!
                        </span>

                    </div>

                </div>

            </section>


            <!-- =====================================
                 SIDE PANEL
            ====================================== -->

            <aside class="panel">


                <!-- NAME -->

                <div class="fish-name-box">

                    <div>

                        <div class="small-label">
                            MY FISH
                        </div>

                        <div
                            id="fishName"
                            class="fish-name"
                        >
                            BUBBLES
                        </div>

                    </div>

                    <button
                        id="renameBtn"
                        class="tiny-button"
                        type="button"
                    >
                        ✎
                    </button>

                </div>


                <!-- =================================
                     STATS
                ================================== -->

                <div class="stats">


                    <!-- HEALTH -->

                    <div class="stat">

                        <div class="stat-header">

                            <span>
                                ♥ HEALTH
                            </span>

                            <strong id="healthValue">
                                82
                            </strong>

                        </div>

                        <div class="pixel-bar">

                            <div
                                id="healthBar"
                                class="bar health"
                            ></div>

                        </div>

                    </div>


                    <!-- HUNGER -->

                    <div class="stat">

                        <div class="stat-header">

                            <span>
                                ● HUNGER
                            </span>

                            <strong id="hungerValue">
                                68
                            </strong>

                        </div>

                        <div class="pixel-bar">

                            <div
                                id="hungerBar"
                                class="bar hunger"
                            ></div>

                        </div>

                    </div>


                    <!-- AFFECTION -->

                    <div class="stat">

                        <div class="stat-header">

                            <span>
                                ♥ LOVE
                            </span>

                            <strong id="affectionValue">
                                55
                            </strong>

                        </div>

                        <div class="pixel-bar">

                            <div
                                id="affectionBar"
                                class="bar affection"
                            ></div>

                        </div>

                    </div>


                    <!-- ENERGY -->

                    <div class="stat">

                        <div class="stat-header">

                            <span>
                                ★ ENERGY
                            </span>

                            <strong id="energyValue">
                                76
                            </strong>

                        </div>

                        <div class="pixel-bar">

                            <div
                                id="energyBar"
                                class="bar energy"
                            ></div>

                        </div>

                    </div>


                </div>


                <div class="pixel-divider">
                    ★ ★ ★ ★ ★
                </div>


                <!-- =================================
                     BUTTONS
                ================================== -->

                <div class="controls">


                    <button
                        id="feedBtn"
                        type="button"
                        class="game-button feed-button"
                    >

                        <span class="button-icon">
                            ●
                        </span>

                        <span>
                            FEED
                        </span>

                        <small>
                            FOOD
                        </small>

                    </button>


                    <button
                        id="playBtn"
                        type="button"
                        class="game-button play-button"
                    >

                        <span class="button-icon">
                            ★
                        </span>

                        <span>
                            PLAY
                        </span>

                        <small>
                            FUN
                        </small>

                    </button>


                    <button
                        id="cleanBtn"
                        type="button"
                        class="game-button clean-button"
                    >

                        <span class="button-icon">
                            ✧
                        </span>

                        <span>
                            CLEAN
                        </span>

                        <small>
                            TANK
                        </small>

                    </button>


                    <button
                        id="petBtn"
                        type="button"
                        class="game-button pet-button"
                    >

                        <span class="button-icon">
                            ♥
                        </span>

                        <span>
                            PET
                        </span>

                        <small>
                            LOVE
                        </small>

                    </button>

                </div>


                <!-- =================================
                     DAILY MISSIONS
                ================================== -->

                <div class="mission-box">

                    <div class="mission-title">
                        TODAY'S CARE
                    </div>

                    <div class="mission">

                        <span>
                            FOOD
                        </span>

                        <span id="foodCount">
                            0 / 3
                        </span>

                    </div>

                    <div class="mission">

                        <span>
                            LOVE
                        </span>

                        <span id="loveCount">
                            0 / 3
                        </span>

                    </div>

                </div>


            </aside>

        </main>


        <!-- FOOTER -->

        <footer>

            <span>
                © FIN &amp; FRIENDS
            </span>

            <button
                id="resetBtn"
                type="button"
            >
                RESET GAME
            </button>

        </footer>

    </div>


    <!-- =========================================
         NAME MODAL
    ========================================== -->

    <div
        id="nameModal"
        class="modal hidden"
    >

        <div class="modal-box">

            <div class="modal-title">
                NAME YOUR FISH
            </div>

            <input
                id="nameInput"
                type="text"
                maxlength="12"
                value="BUBBLES"
            >

            <div class="modal-buttons">

                <button
                    id="cancelName"
                    type="button"
                >
                    CANCEL
                </button>

                <button
                    id="saveName"
                    type="button"
                >
                    OK!
                </button>

            </div>

        </div>

    </div>


    <!-- TOAST -->

    <div
        id="toast"
        class="toast"
    ></div>


    <!-- IMPORTANT:
         JavaScript is loaded AFTER all HTML elements exist.
    -->

    <script src="game.js"></script>

</body>

</html>
