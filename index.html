<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gol-Die - Pixel Aquarium</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main id="aquarium">

    <!-- WATER -->
    <div class="water-line water-line-1"></div>
    <div class="water-line water-line-2"></div>
    <div class="water-line water-line-3"></div>

    <div class="light light-one"></div>
    <div class="light light-two"></div>
    <div class="light light-three"></div>

    <!-- PLANTS -->
    <div class="plant plant-one"></div>
    <div class="plant plant-two"></div>
    <div class="plant plant-three"></div>
    <div class="plant plant-four"></div>

    <!-- BUBBLES -->
    <div class="bubble bubble-one"></div>
    <div class="bubble bubble-two"></div>
    <div class="bubble bubble-three"></div>
    <div class="bubble bubble-four"></div>

    <!-- ==================================================
         HUD
    =================================================== -->

    <section id="hud">

        <!-- STATS -->

        <div id="status-panel">

            <div id="fish-name">GOL-DIE</div>

            <div class="stat">
                <div class="stat-icon heart-icon">♥</div>

                <div class="stat-info">
                    <div class="stat-name">HEALTH</div>

                    <div class="pixel-stat-bar">
                        <div id="health-bar" class="pixel-stat-fill"></div>
                    </div>
                </div>
            </div>

            <div class="stat">
                <div class="stat-icon food-icon">●</div>

                <div class="stat-info">
                    <div class="stat-name">HUNGER</div>

                    <div class="pixel-stat-bar">
                        <div id="hunger-bar" class="pixel-stat-fill"></div>
                    </div>
                </div>
            </div>

            <div class="stat">
                <div class="stat-icon happy-icon">♥</div>

                <div class="stat-info">
                    <div class="stat-name">HAPPY</div>

                    <div class="pixel-stat-bar">
                        <div id="happiness-bar" class="pixel-stat-fill"></div>
                    </div>
                </div>
            </div>

            <div class="stat">
                <div class="stat-icon affection-icon">♥</div>

                <div class="stat-info">
                    <div class="stat-name">AFFECTION</div>

                    <div class="pixel-stat-bar">
                        <div id="affection-bar" class="pixel-stat-fill"></div>
                    </div>
                </div>
            </div>

            <div class="stat">
                <div class="stat-icon clean-icon">✦</div>

                <div class="stat-info">
                    <div class="stat-name">CLEAN</div>

                    <div class="pixel-stat-bar">
                        <div id="clean-bar" class="pixel-stat-fill"></div>
                    </div>
                </div>
            </div>

            <div class="stat">
                <div class="stat-icon energy-icon">☀</div>

                <div class="stat-info">
                    <div class="stat-name">ENERGY</div>

                    <div class="pixel-stat-bar">
                        <div id="energy-bar" class="pixel-stat-fill"></div>
                    </div>
                </div>
            </div>

        </div>

        <!-- TIME -->

        <div id="time-panel">
            <div id="fish-time">08:00 AM</div>
            <div id="day-counter">DAY 1</div>
        </div>

        <!-- CONTROLS -->

        <div id="controls">

            <button
                id="food-button"
                class="pixel-button food-button"
                type="button"
            >
                FOOD
            </button>

            <button
                id="clean-button"
                class="pixel-button clean-button"
                type="button"
            >
                CLEAN
            </button>

            <button
                id="sleep-button"
                class="pixel-button sleep-button"
                type="button"
            >
                SLEEP
            </button>

        </div>

    </section>


    <!-- ==================================================
         FOOD MENU
    =================================================== -->

    <div id="food-panel">

        <button
            class="food-choice"
            data-food="flake"
            type="button"
        >
            FISH FLAKE
        </button>

    </div>


    <!-- ==================================================
         FISH
    =================================================== -->

    <div id="fish-container">

        <canvas
            id="fish-canvas"
            width="220"
            height="160"
        ></canvas>

        <div id="fish-shadow"></div>

    </div>


    <!-- ==================================================
         SLEEP
    =================================================== -->

    <div id="sleep-zone">

        <div id="sleep-text">
            Z Z Z...
        </div>

        <div id="pillow"></div>

        <div id="blanket"></div>

    </div>


    <!-- FLOOR -->

    <div id="gravel"></div>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- CUSTOM CURSOR -->

    <div id="hand-cursor">☝</div>

</main>

<script src="script.js"></script>

</body>
</html>
