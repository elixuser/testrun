<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gol-Die — Pixel Aquarium</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;

            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }


        html,
        body {
            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #173b45;

            font-family:
                "Courier New",
                monospace;
        }


        body {
            cursor: none;

            user-select: none;
            -webkit-user-select: none;
        }


        /* =====================================================
           AQUARIUM
        ===================================================== */

        #aquarium {

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            /*
                Retro blue/green aquarium palette.
            */

            background:
                linear-gradient(
                    180deg,
                    #284b56 0%,
                    #315a64 28%,
                    #386670 55%,
                    #315d65 75%,
                    #254b51 100%
                );
        }


        /* =====================================================
           GLASS BORDER
        ===================================================== */

        #aquarium::after {

            content: "";

            position: absolute;

            inset: 0;

            border:
                6px solid
                rgba(
                    12,
                    27,
                    31,
                    0.75
                );

            pointer-events: none;

            z-index: 900;
        }


        /* =====================================================
           WATER LINES
        ===================================================== */

        .water-line {

            position: absolute;

            left: 0;

            width: 100%;

            height: 3px;

            background: #a7d3cb;

            opacity: 0.11;

            pointer-events: none;

            z-index: 1;
        }


        .water-line:nth-child(1) {
            top: 23%;
        }


        .water-line:nth-child(2) {
            top: 49%;
        }


        .water-line:nth-child(3) {
            top: 72%;
        }


        /* =====================================================
           WATER LIGHT
        ===================================================== */

        .light {

            position: absolute;

            top: -20%;

            width: 100px;

            height: 150%;

            background: #cce8df;

            opacity: 0.035;

            pointer-events: none;

            transform: rotate(9deg);

            z-index: 1;
        }


        .light.one {
            left: 10%;
        }


        .light.two {
            left: 39%;

            transform: rotate(-7deg);
        }


        .light.three {
            right: 12%;

            transform: rotate(11deg);
        }


        /* =====================================================
           PLANTS
        ===================================================== */

        .plant {

            position: absolute;

            bottom: 55px;

            width: 18px;

            background:
                #315d49;

            z-index: 3;

            opacity: 0.85;

            pointer-events: none;

            transform-origin: bottom;
        }


        .plant::before,
        .plant::after {

            content: "";

            position: absolute;

            width: 38px;

            height: 12px;

            background: #3a6b51;
        }


        .plant::before {

            left: -28px;

            bottom: 30px;

            transform: rotate(-20deg);
        }


        .plant::after {

            right: -28px;

            bottom: 65px;

            transform: rotate(20deg);
        }


        .plant.one {

            left: 7%;

            height: 150px;
        }


        .plant.two {

            left: 13%;

            height: 100px;
        }


        .plant.three {

            right: 8%;

            height: 175px;
        }


        .plant.four {

            right: 15%;

            height: 115px;
        }


        /* =====================================================
           GRAVEL
        ===================================================== */

        #gravel {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;

            height: 58px;

            background:
                repeating-linear-gradient(
                    90deg,
                    #283f3d 0 9px,
                    #354e48 9px 18px,
                    #41584b 18px 27px,
                    #2b4542 27px 38px
                );

            border-top:
                5px solid #1e3539;

            z-index: 5;
        }


        /* =====================================================
           BUBBLES
        ===================================================== */

        .bubble {

            position: absolute;

            width: 7px;
            height: 7px;

            border:
                2px solid
                rgba(
                    190,
                    225,
                    216,
                    0.45
                );

            pointer-events: none;

            z-index: 4;

            animation:
                rise 6s linear infinite;
        }


        @keyframes rise {

            0% {
                transform: translateY(20px);
                opacity: 0;
            }

            15% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }


        /* =====================================================
           TOP HUD
        ===================================================== */

        #hud {

            position: absolute;

            top: 16px;
            left: 50%;

            transform:
                translateX(-50%);

            width:
                min(
                    1180px,
                    calc(100% - 35px)
                );

            display: flex;

            align-items: flex-start;

            gap: 18px;

            z-index: 100;

            pointer-events: none;
        }


        #hud > * {
            pointer-events: auto;
        }


        /* =====================================================
           STAT PANEL

           IMPORTANT:
           There is intentionally NO background box here.
        ===================================================== */

        #status-panel {

            width: 330px;

            display: flex;

            flex-direction: column;

            gap: 5px;

            background: transparent;

            border: none;

            box-shadow: none;
        }


        /* =====================================================
           FISH NAME
        ===================================================== */

        #fish-name {

            color: #f0d47c;

            font-size: 17px;

            font-weight: bold;

            letter-spacing: 3px;

            text-shadow:
                2px 2px 0 #172b2f;

            margin-bottom: 3px;
        }


        /* =====================================================
           STAT ROW
        ===================================================== */

        .stat {

            display: flex;

            align-items: center;

            gap: 7px;

            width: 320px;

            height: 39px;
        }


        /* =====================================================
           STAT ICON

           These are intentionally pixel/RPG inspired.
        ===================================================== */

        .stat-icon {

            position: relative;

            flex-shrink: 0;

            width: 34px;
            height: 34px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: #a97959;

            border:
                3px solid #15191d;

            box-shadow:
                3px 0 #d1a65d,
                -3px 0 #d1a65d,
                0 3px #d1a65d,
                0 -3px #d1a65d;

            font-size: 19px;

            font-weight: bold;

            color: #ed6884;

            text-shadow:
                2px 2px 0 #573039;
        }


        /* =====================================================
           STAT INFORMATION
        ===================================================== */

        .stat-info {

            flex: 1;

            min-width: 0;
        }


        .stat-name {

            height: 10px;

            margin-left: 2px;

            color: #ead89a;

            font-size: 8px;

            font-weight: bold;

            letter-spacing: 1px;

            text-shadow:
                1px 1px 0 #182b2f;
        }


        /* =====================================================
           STAT BAR

           THIS is the colourful heart-style bar.
        ===================================================== */

        .pixel-stat-bar {

            position: relative;

            width: 100%;

            height: 21px;

            background: #45435e;

            border:
                3px solid #15191d;

            box-shadow:
                3px 0 #d2a653,
                -3px 0 #d2a653,
                0 3px #d2a653,
                0 -3px #d2a653;

            overflow: hidden;
        }


        /* =====================================================
           BAR FILL
        ===================================================== */

        .pixel-stat-fill {

            position: absolute;

            left: 0;
            top: 0;

            height: 100%;

            width: 100%;

            transition:
                width 0.35s steps(5);
        }


        /* =====================================================
           BAR HIGHLIGHT
        ===================================================== */

        .pixel-stat-fill::before {

            content: "";

            position: absolute;

            left: 0;
            top: 2px;

            width: 72%;

            height: 5px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.18
                );
        }


        /* =====================================================
           BAR SHADOW
        ===================================================== */

        .pixel-stat-fill::after {

            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;

            height: 4px;

            background:
                rgba(
                    50,
                    20,
                    30,
                    0.18
                );
        }


        /* =====================================================
           INDIVIDUAL BAR COLOURS
        ===================================================== */

        #health-bar {
            background: #d84d68;
        }


        #hunger-bar {
            background: #e09a48;
        }


        #happiness-bar {
            background: #dc6387;
        }


        #affection-bar {
            background: #e87599;
        }


        #clean-bar {
            background: #63aaa0;
        }


        #energy-bar {
            background: #8b8bc5;
        }


        /* =====================================================
           TIME
        ===================================================== */

        #time-panel {

            min-width: 120px;

            padding-top: 8px;

            text-align: center;

            color: #dfd79a;

            text-shadow:
                2px 2px 0 #182b2f;
        }


        #fish-time {

            color: #f0d47c;

            font-size: 19px;

            font-weight: bold;
        }


        #day-counter {

            margin-top: 4px;

            font-size: 8px;

            letter-spacing: 2px;

            color: #bfcdb6;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        #controls {

            display: flex;

            align-items: center;

            gap: 8px;

            padding-top: 4px;
        }


        .pixel-button {

            height: 38px;

            min-width: 70px;

            padding:
                5px 8px;

            border:
                3px solid #17191d;

            box-shadow:
                3px 3px 0 #d0a451;

            font-family:
                "Courier New",
                monospace;

            font-size: 9px;

            font-weight: bold;

            letter-spacing: 1px;

            color: #211d24;

            cursor: none;

            transition:
                transform 0.08s,
                box-shadow 0.08s,
                filter 0.1s;
        }


        .pixel-button:hover {

            filter:
                brightness(1.18);
        }


        .pixel-button:active {

            transform:
                translate(
                    3px,
                    3px
                );

            box-shadow: none;
        }


        #food-button {

            background: #d69d4d;
        }


        #clean-button {

            background: #70aaa4;
        }


        #sleep-button {

            background: #8a87b4;
        }


        /* =====================================================
           FISH

           IMPORTANT:
           The fish starts in the exact middle of the tank.
        ===================================================== */

        #fish-container {

            position: absolute;

            /*
                These are deliberately explicit.

                This prevents the fish from falling into
                the browser's default absolute position.
            */

            left: 50%;
            top: 55%;

            width: 220px;
            height: 160px;

            transform:
                translate(
                    -50%,
                    -50%
                );

            z-index: 40;

            transition:
                left 1.5s ease-in-out,
                top 1.5s ease-in-out;

            cursor: none;
        }


        #fish-canvas {

            display: block;

            width: 220px;
            height: 160px;

            cursor: none;
        }


        /* =====================================================
           FISH SHADOW
        ===================================================== */

        #fish-shadow {

            position: absolute;

            left: 60px;
            bottom: 10px;

            width: 100px;
            height: 12px;

            background:
                rgba(
                    11,
                    29,
                    32,
                    0.25
                );

            z-index: -1;
        }


        /* =====================================================
           HEARTS
        ===================================================== */

        .heart {

            position: fixed;

            z-index: 500;

            color: #ef7794;

            font-family:
                "Courier New",
                monospace;

            font-size: 23px;

            font-weight: bold;

            pointer-events: none;

            text-shadow:
                2px 2px 0 #542c38;

            animation:
                heart-pop 1.2s steps(8)
                forwards;
        }


        @keyframes heart-pop {

            0% {

                opacity: 1;

                transform:
                    translate(
                        0,
                        0
                    )
                    scale(0.7);
            }

            25% {

                transform:
                    translate(
                        0,
                        -12px
                    )
                    scale(1.1);
            }

            100% {

                opacity: 0;

                transform:
                    translate(
                        var(--heart-x),
                        -85px
                    )
                    scale(1.3);
            }
        }


        /* =====================================================
           FOOD
        ===================================================== */

        .food-item {

            position: absolute;

            width: 26px;
            height: 26px;

            z-index: 35;

            cursor: none;

            animation:
                food-appear
                0.25s steps(3);
        }


        .food-pellet {

            position: absolute;

            left: 5px;
            top: 5px;

            width: 15px;
            height: 12px;

            background: #dfa94c;

            border:
                3px solid #66452a;

            box-shadow:
                2px 2px 0
                rgba(
                    20,
                    25,
                    20,
                    0.3
                );
        }


        @keyframes food-appear {

            from {

                opacity: 0;

                transform:
                    translateY(-20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
           FOOD PANEL
        ===================================================== */

        #food-panel {

            position: absolute;

            top: 72px;
            left: 50%;

            transform:
                translateX(-50%);

            display: none;

            padding: 8px;

            background: #183138;

            border:
                3px solid #111b1e;

            z-index: 150;
        }


        .food-choice {

            padding:
                7px 10px;

            background: #d09a4e;

            border:
                3px solid #513b29;

            color: #241d20;

            font-family:
                "Courier New",
                monospace;

            font-size: 9px;

            font-weight: bold;

            cursor: none;
        }


        .food-choice:hover {

            background: #e6b865;
        }


        /* =====================================================
           SLEEP
        ===================================================== */

        #sleep-zone {

            position: absolute;

            left: 50%;

            bottom: 65px;

            width: 320px;
            height: 130px;

            transform:
                translateX(-50%);

            display: none;

            z-index: 30;
        }


        #pillow {

            position: absolute;

            left: 70px;
            bottom: 10px;

            width: 75px;
            height: 38px;

            background: #d8cec2;

            border:
                4px solid #4b4848;

            box-shadow:
                inset 6px 5px 0 #eee5d9;
        }


        #blanket {

            position: absolute;

            left: 115px;
            bottom: 0;

            width: 140px;
            height: 78px;

            background:
                repeating-linear-gradient(
                    0deg,
                    #657e9b 0 12px,
                    #7e94ac 12px 24px
                );

            border:
                5px solid #35495b;

            border-radius:
                35px 35px 12px 12px;

            box-shadow:
                inset 7px 0 #526d86;
        }


        #sleep-text {

            position: absolute;

            top: 15px;
            left: 0;

            color: #d5e5de;

            font-size: 13px;

            animation:
                sleepy 1.5s steps(2)
                infinite;
        }


        @keyframes sleepy {

            50% {
                opacity: 0.3;
            }
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        #message {

            position: absolute;

            left: 50%;
            bottom: 28px;

            transform:
                translateX(-50%);

            padding:
                8px 14px;

            background: #162d33;

            border:
                3px solid #0c1d21;

            color: #d7e7de;

            font-size: 10px;

            z-index: 200;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 0.2s;
        }


        #message.show {

            opacity: 1;
        }


        /* =====================================================
           CUSTOM HAND CURSOR
        ===================================================== */

        #hand-cursor {

            position: fixed;

            left: 0;
            top: 0;

            width: 30px;
            height: 30px;

            z-index: 9999;

            pointer-events: none;

            font-size: 26px;

            transform:
                translate(
                    -4px,
                    -4px
                );

            filter:
                drop-shadow(
                    2px 2px 0 #14282d
                );
        }


        /* =====================================================
           NIGHT MODE
        ===================================================== */

        #aquarium.night {

            filter:
                brightness(0.68);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            #hud {

                top: 8px;
                left: 8px;

                transform: none;

                width:
                    calc(100% - 16px);

                gap: 5px;

                flex-wrap: wrap;
            }


            #status-panel {

                width: 235px;
            }


            .stat {

                width: 225px;

                height: 34px;
            }


            .stat-icon {

                width: 30px;
                height: 30px;

                font-size: 16px;
            }


            .pixel-stat-bar {

                height: 17px;
            }


            .stat-name {

                font-size: 7px;

                height: 9px;
            }


            #fish-name {

                font-size: 12px;
            }


            #time-panel {

                min-width: 85px;
            }


            #fish-time {

                font-size: 13px;
            }


            #controls {

                width: 100%;

                justify-content: center;

                flex-wrap: wrap;
            }


            .pixel-button {

                min-width: 58px;

                height: 31px;

                font-size: 7px;
            }


            #fish-container {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(0.78);
            }
        }


        @media (max-width: 500px) {

            #status-panel {

                width: 205px;
            }


            .stat {

                width: 200px;
            }


            #fish-container {

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(0.65);
            }


            #time-panel {

                min-width: 70px;
            }


            #fish-time {

                font-size: 11px;
            }


            .pixel-button {

                min-width: 50px;

                height: 27px;

                padding: 3px;

                font-size: 6px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         AQUARIUM
    ====================================================== -->

    <main id="aquarium">


        <!-- WATER -->

        <div class="water-line"></div>
        <div class="water-line"></div>
        <div class="water-line"></div>


        <div class="light one"></div>
        <div class="light two"></div>
        <div class="light three"></div>


        <!-- PLANTS -->

        <div class="plant one"></div>
        <div class="plant two"></div>
        <div class="plant three"></div>
        <div class="plant four"></div>


        <!-- BUBBLES -->

        <div
            class="bubble"
            style="
                left:18%;
                bottom:20%;
                animation-delay:0s;
            "
        ></div>

        <div
            class="bubble"
            style="
                left:31%;
                bottom:12%;
                animation-delay:2s;
            "
        ></div>

        <div
            class="bubble"
            style="
                left:67%;
                bottom:18%;
                animation-delay:4s;
            "
        ></div>

        <div
            class="bubble"
            style="
                left:83%;
                bottom:25%;
                animation-delay:1s;
            "
        ></div>


        <!-- =================================================
             HUD
        ================================================== -->

        <section id="hud">


            <!-- STATS -->

            <div id="status-panel">

                <div id="fish-name">
                    GOL-DIE
                </div>


                <!-- HEALTH -->

                <div class="stat">

                    <div class="stat-icon">
                        ♥
                    </div>

                    <div class="stat-info">

                        <div class="stat-name">
                            HEALTH
                        </div>

                        <div class="pixel-stat-bar">

                            <div
                                id="health-bar"
                                class="pixel-stat-fill"
                            ></div>

                        </div>

                    </div>

                </div>


                <!-- HUNGER -->

                <div class="stat">

                    <div class="stat-icon">
                        ●
                    </div>

                    <div class="stat-info">

                        <div class="stat-name">
                            HUNGER
                        </div>

                        <div class="pixel-stat-bar">

                            <div
                                id="hunger-bar"
                                class="pixel-stat-fill"
                            ></div>

                        </div>

                    </div>

                </div>


                <!-- HAPPINESS -->

                <div class="stat">

                    <div class="stat-icon">
                        ♥
                    </div>

                    <div class="stat-info">

                        <div class="stat-name">
                            HAPPY
                        </div>

                        <div class="pixel-stat-bar">

                            <div
                                id="happiness-bar"
                                class="pixel-stat-fill"
                            ></div>

                        </div>

                    </div>

                </div>


                <!-- AFFECTION -->

                <div class="stat">

                    <div class="stat-icon">
                        ♥
                    </div>

                    <div class="stat-info">

                        <div class="stat-name">
                            AFFECTION
                        </div>

                        <div class="pixel-stat-bar">

                            <div
                                id="affection-bar"
                                class="pixel-stat-fill"
                            ></div>

                        </div>

                    </div>

                </div>


                <!-- CLEAN -->

                <div class="stat">

                    <div class="stat-icon">
                        ✦
                    </div>

                    <div class="stat-info">

                        <div class="stat-name">
                            CLEAN
                        </div>

                        <div class="pixel-stat-bar">

                            <div
                                id="clean-bar"
                                class="pixel-stat-fill"
                            ></div>

                        </div>

                    </div>

                </div>


                <!-- ENERGY -->

                <div class="stat">

                    <div class="stat-icon">
                        ☀
                    </div>

                    <div class="stat-info">

                        <div class="stat-name">
                            ENERGY
                        </div>

                        <div class="pixel-stat-bar">

                            <div
                                id="energy-bar"
                                class="pixel-stat-fill"
                            ></div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- TIME -->

            <div id="time-panel">

                <div id="fish-time">
                    08:00 AM
                </div>

                <div id="day-counter">
                    DAY 1
                </div>

            </div>


            <!-- BUTTONS -->

            <div id="controls">

                <button
                    id="food-button"
                    class="pixel-button"
                    type="button"
                >
                    FOOD
                </button>

                <button
                    id="clean-button"
                    class="pixel-button"
                    type="button"
                >
                    CLEAN
                </button>

                <button
                    id="sleep-button"
                    class="pixel-button"
                    type="button"
                >
                    SLEEP
                </button>

            </div>

        </section>


        <!-- =================================================
             FOOD MENU
        ================================================== -->

        <div id="food-panel">

            <button
                class="food-choice"
                data-food="flake"
                type="button"
            >
                FISH FLAKE
            </button>

        </div>


        <!-- =================================================
             FISH
        ================================================== -->

        <div id="fish-container">

            <canvas
                id="fish-canvas"
                width="220"
                height="160"
            ></canvas>

            <div id="fish-shadow"></div>

        </div>


        <!-- =================================================
             SLEEP AREA
        ================================================== -->

        <div id="sleep-zone">

            <div id="sleep-text">
                Z Z Z...
            </div>

            <div id="pillow"></div>

            <div id="blanket"></div>

        </div>


        <!-- GRAVEL -->

        <div id="gravel"></div>


        <!-- MESSAGE -->

        <div id="message"></div>


        <!-- CUSTOM CURSOR -->

        <div id="hand-cursor">
            ☝
        </div>


    </main>


    <script>

        /* =====================================================
           GOL-DIE GAME ENGINE
        ===================================================== */


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const aquarium =
            document.getElementById("aquarium");

        const fishContainer =
            document.getElementById("fish-container");

        const canvas =
            document.getElementById("fish-canvas");

        const ctx =
            canvas.getContext("2d");

        const cursor =
            document.getElementById("hand-cursor");

        const message =
            document.getElementById("message");

        const foodPanel =
            document.getElementById("food-panel");

        const sleepZone =
            document.getElementById("sleep-zone");

        const fishTime =
            document.getElementById("fish-time");

        const dayCounter =
            document.getElementById("day-counter");


        /* =====================================================
           STAT ELEMENTS
        ===================================================== */

        const bars = {

            health:
                document.getElementById(
                    "health-bar"
                ),

            hunger:
                document.getElementById(
                    "hunger-bar"
                ),

            happiness:
                document.getElementById(
                    "happiness-bar"
                ),

            affection:
                document.getElementById(
                    "affection-bar"
                ),

            clean:
                document.getElementById(
                    "clean-bar"
                ),

            energy:
                document.getElementById(
                    "energy-bar"
                )
        };


        /* =====================================================
           GAME STATE
        ===================================================== */

        const state = {

            health: 100,

            hunger: 82,

            happiness: 76,

            affection: 58,

            clean: 90,

            energy: 85,

            sleeping: false,

            fishHour: 8,

            day: 1,

            direction: 1,

            x: window.innerWidth / 2,

            y: window.innerHeight * 0.55,

            targetX:
                window.innerWidth / 2,

            targetY:
                window.innerHeight * 0.55,

            food: []

        };


        /* =====================================================
           UTILITY
        ===================================================== */

        function clamp(
            value,
            min = 0,
            max = 100
        ) {

            return Math.max(
                min,
                Math.min(
                    max,
                    value
                )
            );
        }


        function showMessage(text) {

            message.textContent =
                text;

            message.classList.add(
                "show"
            );

            clearTimeout(
                showMessage.timer
            );

            showMessage.timer =
                setTimeout(
                    () => {

                        message.classList.remove(
                            "show"
                        );

                    },
                    1800
                );
        }


        /* =====================================================
           STAT BARS
        ===================================================== */

        function updateBars() {

            bars.health.style.width =
                state.health + "%";

            bars.hunger.style.width =
                state.hunger + "%";

            bars.happiness.style.width =
                state.happiness + "%";

            bars.affection.style.width =
                state.affection + "%";

            bars.clean.style.width =
                state.clean + "%";

            bars.energy.style.width =
                state.energy + "%";
        }


        /* =====================================================
           TIME

           2 REAL MINUTES = 1 FISH HOUR
        ===================================================== */

        const REAL_MS_PER_FISH_HOUR =
            2 * 60 * 1000;


        let lastTime =
            Date.now();


        let elapsedFishTime = 0;


        function updateFishTime() {

            const now =
                Date.now();

            const delta =
                now - lastTime;

            lastTime =
                now;

            elapsedFishTime +=
                delta;


            while (
                elapsedFishTime >=
                REAL_MS_PER_FISH_HOUR
            ) {

                elapsedFishTime -=
                    REAL_MS_PER_FISH_HOUR;

                state.fishHour++;

                if (
                    state.fishHour >= 24
                ) {

                    state.fishHour = 0;

                    state.day++;
                }

                hourlyDecay();
            }


            let hour =
                state.fishHour;

            const ampm =
                hour >= 12
                    ? "PM"
                    : "AM";

            let displayHour =
                hour % 12;

            if (
                displayHour === 0
            ) {
                displayHour = 12;
            }

            fishTime.textContent =
                String(
                    displayHour
                ).padStart(
                    2,
                    "0"
                ) +
                ":00 " +
                ampm;

            dayCounter.textContent =
                "DAY " +
                state.day;
        }


        function hourlyDecay() {

            if (
                state.sleeping
            ) {

                state.energy =
                    clamp(
                        state.energy + 9
                    );

                state.health =
                    clamp(
                        state.health + 2
                    );

                state.hunger =
                    clamp(
                        state.hunger - 3
                    );

            } else {

                state.hunger =
                    clamp(
                        state.hunger - 5
                    );

                state.clean =
                    clamp(
                        state.clean - 3
                    );

                state.energy =
                    clamp(
                        state.energy - 4
                    );

                state.happiness =
                    clamp(
                        state.happiness - 2
                    );

                if (
                    state.hunger < 25
                ) {

                    state.health =
                        clamp(
                            state.health - 4
                        );
                }

                if (
                    state.clean < 25
                ) {

                    state.health =
                        clamp(
                            state.health - 3
                        );
                }
            }

            updateBars();
        }


        /* =====================================================
           CUSTOM CURSOR
        ===================================================== */

        document.addEventListener(
            "mousemove",
            event => {

                cursor.style.left =
                    event.clientX +
                    "px";

                cursor.style.top =
                    event.clientY +
                    "px";
            }
        );


        /* =====================================================
           DRAW FISH
        ===================================================== */

        function drawFish() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            /*
                Pixel goldfish.

                We deliberately draw it at a large
                scale so it cannot appear as the tiny
                fish from your screenshot.
            */

            const flip =
                state.direction === -1
                    ? -1
                    : 1;


            ctx.save();


            ctx.translate(
                110,
                80
            );

            ctx.scale(
                flip,
                1
            );


            /* -----------------------------
               TAIL
            ----------------------------- */

            ctx.fillStyle =
                "#e87525";

            ctx.beginPath();

            ctx.moveTo(
                45,
                -4
            );

            ctx.lineTo(
                86,
                -35
            );

            ctx.lineTo(
                73,
                -3
            );

            ctx.lineTo(
                90,
                25
            );

            ctx.lineTo(
                48,
                10
            );

            ctx.closePath();

            ctx.fill();


            /* tail shadow */

            ctx.fillStyle =
                "#bd4e20";

            ctx.fillRect(
                61,
                2,
                22,
                8
            );


            /* -----------------------------
               BODY
            ----------------------------- */

            ctx.fillStyle =
                "#f58a28";

            ctx.beginPath();

            ctx.ellipse(
                0,
                0,
                62,
                42,
                0,
                0,
                Math.PI * 2
            );

            ctx.fill();


            /* -----------------------------
               BODY SHADOW
            ----------------------------- */

            ctx.fillStyle =
                "#d75a20";

            ctx.fillRect(
                -42,
                18,
                68,
                14
            );


            /* -----------------------------
               BODY HIGHLIGHT
            ----------------------------- */

            ctx.fillStyle =
                "#ffbd3d";

            ctx.fillRect(
                -25,
                -27,
                35,
                9
            );

            ctx.fillRect(
                -35,
                -17,
                25,
                8
            );


            /* -----------------------------
               TOP FIN
            ----------------------------- */

            ctx.fillStyle =
                "#f26c20";

            ctx.beginPath();

            ctx.moveTo(
                -12,
                -34
            );

            ctx.lineTo(
                12,
                -62
            );

            ctx.lineTo(
                30,
                -33
            );

            ctx.closePath();

            ctx.fill();


            /* -----------------------------
               LOWER FIN
            ----------------------------- */

            ctx.fillStyle =
                "#e46521";

            ctx.beginPath();

            ctx.moveTo(
                -8,
                30
            );

            ctx.lineTo(
                10,
                55
            );

            ctx.lineTo(
                25,
                30
            );

            ctx.closePath();

            ctx.fill();


            /* -----------------------------
               EYE
            ----------------------------- */

            ctx.fillStyle =
                "#f9df7b";

            ctx.fillRect(
                -48,
                -19,
                23,
                23
            );


            ctx.fillStyle =
                "#1e2527";

            ctx.fillRect(
                -43,
                -15,
                13,
                15
            );


            /* eye shine */

            ctx.fillStyle =
                "#ffffff";

            ctx.fillRect(
                -40,
                -13,
                4,
                4
            );


            /* -----------------------------
               MOUTH
            ----------------------------- */

            ctx.fillStyle =
                "#7e3424";

            ctx.fillRect(
                -60,
                8,
                11,
                6
            );


            /* -----------------------------
               PIXEL SCALES
            ----------------------------- */

            ctx.fillStyle =
                "rgba(255,205,65,0.55)";


            const scales = [
                [-18,-5],
                [0,-9],
                [18,-2],
                [-23,12],
                [-2,10],
                [18,13],
                [2,25]
            ];


            for (
                const [x, y]
                of scales
            ) {

                ctx.fillRect(
                    x,
                    y,
                    8,
                    5
                );
            }


            ctx.restore();
        }


        /* =====================================================
           FISH POSITION
        ===================================================== */

        function keepFishOnScreen() {

            const width =
                window.innerWidth;

            const height =
                window.innerHeight;


            /*
                The HUD occupies the upper portion,
                so the fish is deliberately kept
                below it.
            */

            const minX =
                Math.max(
                    120,
                    width * 0.15
                );

            const maxX =
                Math.min(
                    width - 120,
                    width * 0.85
                );


            const minY =
                Math.max(
                    190,
                    height * 0.30
                );

            const maxY =
                Math.min(
                    height - 130,
                    height * 0.78
                );


            state.targetX =
                Math.max(
                    minX,
                    Math.min(
                        maxX,
                        state.targetX
                    )
                );


            state.targetY =
                Math.max(
                    minY,
                    Math.min(
                        maxY,
                        state.targetY
                    )
                );
        }


        function moveFish() {

            if (
                state.sleeping
            ) {
                return;
            }


            const dx =
                state.targetX -
                state.x;

            const dy =
                state.targetY -
                state.y;


            state.x +=
                dx * 0.008;

            state.y +=
                dy * 0.008;


            if (
                Math.abs(dx) > 2
            ) {

                state.direction =
                    dx > 0
                        ? 1
                        : -1;
            }


            fishContainer.style.left =
                state.x + "px";

            fishContainer.style.top =
                state.y + "px";


            if (
                Math.abs(dx) < 5 &&
                Math.abs(dy) < 5
            ) {

                chooseFishTarget();
            }
        }


        function chooseFishTarget() {

            const width =
                window.innerWidth;

            const height =
                window.innerHeight;


            state.targetX =
                width *
                (
                    0.20 +
                    Math.random() *
                    0.60
                );


            state.targetY =
                height *
                (
                    0.35 +
                    Math.random() *
                    0.35
                );


            keepFishOnScreen();
        }


        /* =====================================================
           PET FISH
        ===================================================== */

        fishContainer.addEventListener(
            "click",
            event => {

                if (
                    state.sleeping
                ) {

                    showMessage(
                        "GOL-DIE IS SLEEPING..."
                    );

                    return;
                }


                state.affection =
                    clamp(
                        state.affection + 6
                    );

                state.happiness =
                    clamp(
                        state.happiness + 4
                    );

                createHearts(
                    event.clientX,
                    event.clientY
                );

                showMessage(
                    "GOL-DIE LIKES THAT ♥"
                );

                updateBars();
            }
        );


        function createHearts(
            x,
            y
        ) {

            for (
                let i = 0;
                i < 4;
                i++
            ) {

                const heart =
                    document.createElement(
                        "div"
                    );

                heart.className =
                    "heart";

                heart.textContent =
                    "♥";

                heart.style.left =
                    (
                        x +
                        (Math.random() * 40 - 20)
                    ) + "px";

                heart.style.top =
                    (
                        y +
                        (Math.random() * 20 - 10)
                    ) + "px";

                heart.style.setProperty(
                    "--heart-x",
                    (
                        Math.random() * 60 -
                        30
                    ) + "px"
                );

                document.body.appendChild(
                    heart
                );


                setTimeout(
                    () => {
                        heart.remove();
                    },
                    1300
                );
            }
        }


        /* =====================================================
           FOOD
        ===================================================== */

        const foodButton =
            document.getElementById(
                "food-button"
            );


        foodButton.addEventListener(
            "click",
            () => {

                foodPanel.style.display =
                    foodPanel.style.display ===
                    "block"
                        ? "none"
                        : "block";
            }
        );


        document
            .querySelectorAll(
                ".food-choice"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            spawnFood();

                            foodPanel.style.display =
                                "none";

                            showMessage(
                                "A FISH FLAKE APPEARED!"
                            );
                        }
                    );
                }
            );


        function spawnFood() {

            const food =
                document.createElement(
                    "div"
                );

            food.className =
                "food-item";


            const pellet =
                document.createElement(
                    "div"
                );

            pellet.className =
                "food-pellet";


            food.appendChild(
                pellet
            );


            /*
                Food starts near the top-middle
                of the aquarium.
            */

            food.style.left =
                (
                    window.innerWidth / 2 +
                    Math.random() * 160 -
                    80
                ) + "px";


            food.style.top =
                "130px";


            aquarium.appendChild(
                food
            );


            let y =
                130;


            const fall =
                setInterval(
                    () => {

                        y += 1.5;

                        food.style.top =
                            y + "px";


                        /*
                            Food reaches the fish's
                            general area.
                        */

                        const fishX =
                            state.x;

                        const fishY =
                            state.y;


                        const foodX =
                            parseFloat(
                                food.style.left
                            );


                        if (
                            Math.abs(
                                foodX -
                                fishX
                            ) < 90 &&
                            Math.abs(
                                y -
                                fishY
                            ) < 70
                        ) {

                            clearInterval(
                                fall
                            );

                            feedFish(
                                food
                            );

                            return;
                        }


                        if (
                            y >
                            window.innerHeight - 80
                        ) {

                            clearInterval(
                                fall
                            );

                            food.remove();

                            showMessage(
                                "THE FOOD SANK..."
                            );
                        }

                    },
                    25
                );
        }


        function feedFish(
            food
        ) {

            if (
                state.sleeping
            ) {

                food.remove();

                showMessage(
                    "GOL-DIE IS SLEEPING!"
                );

                return;
            }


            state.hunger =
                clamp(
                    state.hunger + 22
                );

            state.health =
                clamp(
                    state.health + 4
                );

            state.happiness =
                clamp(
                    state.happiness + 5
                );

            state.energy =
                clamp(
                    state.energy + 2
                );


            food.remove();


            showMessage(
                "YUM! GOL-DIE ATE!"
            );


            updateBars();
        }


        /* =====================================================
           CLEAN
        ===================================================== */

        const cleanButton =
            document.getElementById(
                "clean-button"
            );


        cleanButton.addEventListener(
            "click",
            () => {

                state.clean =
                    clamp(
                        state.clean + 35
                    );

                state.happiness =
                    clamp(
                        state.happiness + 4
                    );

                showMessage(
                    "THE TANK IS SPARKLY!"
                );

                updateBars();
            }
        );


        /* =====================================================
           SLEEP
        ===================================================== */

        const sleepButton =
            document.getElementById(
                "sleep-button"
            );


        sleepButton.addEventListener(
            "click",
            () => {

                state.sleeping =
                    !state.sleeping;


                if (
                    state.sleeping
                ) {

                    sleepZone.style.display =
                        "block";

                    aquarium.classList.add(
                        "night"
                    );

                    showMessage(
                        "GOODNIGHT GOL-DIE..."
                    );

                } else {

                    sleepZone.style.display =
                        "none";

                    aquarium.classList.remove(
                        "night"
                    );

                    showMessage(
                        "GOOD MORNING! ♥"
                    );
                }
            }
        );


        /* =====================================================
           RESIZE
        ===================================================== */

        window.addEventListener(
            "resize",
            () => {

                if (
                    state.x >
                    window.innerWidth
                ) {

                    state.x =
                        window.innerWidth / 2;
                }


                if (
                    state.y >
                    window.innerHeight
                ) {

                    state.y =
                        window.innerHeight * 0.55;
                }


                keepFishOnScreen();
            }
        );


        /* =====================================================
           GAME LOOP
        ===================================================== */

        function gameLoop() {

            updateFishTime();

            moveFish();

            drawFish();

            requestAnimationFrame(
                gameLoop
            );
        }


        /* =====================================================
           INITIALISE
        ===================================================== */

        function initialise() {

            /*
                THIS is the important part that fixes
                the fish appearing in the top corner.
            */

            state.x =
                window.innerWidth / 2;

            state.y =
                window.innerHeight * 0.55;

            state.targetX =
                window.innerWidth / 2;

            state.targetY =
                window.innerHeight * 0.55;


            fishContainer.style.left =
                state.x + "px";

            fishContainer.style.top =
                state.y + "px";


            updateBars();

            chooseFishTarget();

            drawFish();

            gameLoop();
        }


        initialise();

    </script>

</body>

</html>
