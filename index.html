<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gol-Die - Pixel Aquarium</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         MAIN AQUARIUM
    ====================================================== -->

    <main id="aquarium">

        <!-- Water effects -->
        <div class="water-line"></div>
        <div class="water-line"></div>
        <div class="water-line"></div>

        <div class="light one"></div>
        <div class="light two"></div>
        <div class="light three"></div>

        <!-- Background plants -->
        <div class="plant one"></div>
        <div class="plant two"></div>
        <div class="plant three"></div>
        <div class="plant four"></div>

        <!-- Bubbles -->
        <div
            class="bubble"
            style="left:18%; bottom:20%; animation-delay:0s;"
        ></div>

        <div
            class="bubble"
            style="left:31%; bottom:12%; animation-delay:2s;"
        ></div>

        <div
            class="bubble"
            style="left:67%; bottom:18%; animation-delay:4s;"
        ></div>

        <div
            class="bubble"
            style="left:83%; bottom:25%; animation-delay:1s;"
        ></div>


        <!-- =================================================
             TOP HUD
        ================================================== -->

        <section id="hud">


            <!-- =================================================
                 STATS
            ================================================== -->

            <div id="status-panel">

                <div id="fish-name">
                    GOL-DIE
                </div>


                <!-- HEALTH -->

                <div class="stat">

                    <div class="stat-icon">
                        ♥
                    </div>

                    <div class="stat-info">

                        <div class="stat-name">
                            HEALTH
                        </div>

                        <div class="pixel-stat-bar">

                            <div
                                id="health-bar"
                                class="pixel-stat-fill"
                            ></div>

                        </div>

                    </div>

                </div>


                <!-- HUNGER -->

                <div class="stat">

                    <div class="stat-icon">
                        ●
                    </div>

                    <div class="stat-info">

                        <div class="stat-name">
                            HUNGER
                        </div>

                        <div class="pixel-stat-bar">

                            <div
                                id="hunger-bar"
                                class="pixel-stat-fill"
                            ></div>

                        </div>

                    </div>

                </div>


                <!-- HAPPINESS -->

                <div class="stat">

                    <div class="stat-icon">
                        ♥
                    </div>

                    <div class="stat-info">

                        <div class="stat-name">
                            HAPPY
                        </div>

                        <div class="pixel-stat-bar">

                            <div
                                id="happiness-bar"
                                class="pixel-stat-fill"
                            ></div>

                        </div>

                    </div>

                </div>


                <!-- AFFECTION -->

                <div class="stat">

                    <div class="stat-icon">
                        ♥
                    </div>

                    <div class="stat-info">

                        <div class="stat-name">
                            AFFECTION
                        </div>

                        <div class="pixel-stat-bar">

                            <div
                                id="affection-bar"
                                class="pixel-stat-fill"
                            ></div>

                        </div>

                    </div>

                </div>


                <!-- CLEAN -->

                <div class="stat">

                    <div class="stat-icon">
                        ✦
                    </div>

                    <div class="stat-info">

                        <div class="stat-name">
                            CLEAN
                        </div>

                        <div class="pixel-stat-bar">

                            <div
                                id="clean-bar"
                                class="pixel-stat-fill"
                            ></div>

                        </div>

                    </div>

                </div>


                <!-- ENERGY -->

                <div class="stat">

                    <div class="stat-icon">
                        ☀
                    </div>

                    <div class="stat-info">

                        <div class="stat-name">
                            ENERGY
                        </div>

                        <div class="pixel-stat-bar">

                            <div
                                id="energy-bar"
                                class="pixel-stat-fill"
                            ></div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 FISH TIME
            ================================================== -->

            <div id="time-panel">

                <div id="fish-time">
                    08:00 AM
                </div>

                <div id="day-counter">
                    DAY 1
                </div>

            </div>


            <!-- =================================================
                 CONTROLS
            ================================================== -->

            <div id="controls">

                <button
                    id="food-button"
                    class="pixel-button"
                    type="button"
                >
                    FOOD
                </button>

                <button
                    id="clean-button"
                    class="pixel-button"
                    type="button"
                >
                    CLEAN
                </button>

                <button
                    id="sleep-button"
                    class="pixel-button"
                    type="button"
                >
                    SLEEP
                </button>

            </div>

        </section>


        <!-- =================================================
             FOOD MENU
        ================================================== -->

        <div id="food-panel">

            <button
                class="food-choice"
                data-food="flake"
                type="button"
            >
                FISH FLAKE
            </button>

        </div>


        <!-- =================================================
             FISH
        ================================================== -->

        <div id="fish-container">

            <canvas
                id="fish-canvas"
                width="220"
                height="160"
            ></canvas>

            <div id="fish-shadow"></div>

        </div>


        <!-- =================================================
             SLEEP AREA
        ================================================== -->

        <div id="sleep-zone">

            <div id="sleep-text">
                Z Z Z...
            </div>

            <div id="pillow"></div>

            <div id="blanket"></div>

        </div>


        <!-- Aquarium floor -->

        <div id="gravel"></div>


        <!-- Message -->

        <div id="message"></div>


        <!-- Custom cursor -->

        <div id="hand-cursor">
            ☝
        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>

</body>

</html>
