<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FIN & FRIENDS</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =================================================
         CUSTOM PIXEL HAND CURSOR
    ================================================== -->

    <div
        id="handCursor"
        class="hand-cursor"
        aria-hidden="true"
    >
        ☝
    </div>


    <!-- =================================================
         WHOLE SCREEN AQUARIUM
    ================================================== -->

    <main
        id="aquarium"
        class="aquarium"
    >


        <!-- =================================================
             WATER BACKGROUND
        ================================================== -->

        <div class="water-background"></div>

        <div class="water-pixels"></div>


        <!-- =================================================
             TOP HUD
        ================================================== -->

        <header class="top-hud">


            <!-- LOGO -->

            <div class="logo">

                <div class="logo-small">
                    PIXEL AQUARIUM
                </div>

                <div class="logo-big">
                    FIN
                </div>

            </div>


            <!-- FISH NAME -->

            <div class="name-display">

                <span>
                    MY FISH
                </span>

                <strong id="fishName">
                    BUBBLES
                </strong>

            </div>


            <!-- TIME -->

            <div class="time-display">

                <div class="time-label">
                    DAY
                </div>

                <strong id="day">
                    1
                </strong>

                <div
                    id="timeLabel"
                    class="clock"
                >
                    08:00
                </div>

            </div>


            <!-- STATUS -->

            <div class="mood-display">

                <div
                    id="moodIcon"
                    class="mood-icon"
                >
                    ♥
                </div>

                <div>

                    <strong id="moodText">
                        HAPPY
                    </strong>

                    <span id="statusText">
                        READY TO PLAY!
                    </span>

                </div>

            </div>


            <!-- CONTROLS -->

            <div class="top-controls">


                <button
                    id="feedBtn"
                    type="button"
                    class="hud-button feed-button"
                >
                    ●
                    <span>FEED</span>
                </button>


                <button
                    id="playBtn"
                    type="button"
                    class="hud-button play-button"
                >
                    ★
                    <span>PLAY</span>
                </button>


                <button
                    id="cleanBtn"
                    type="button"
                    class="hud-button clean-button"
                >
                    ✧
                    <span>CLEAN</span>
                </button>


                <button
                    id="sleepBtn"
                    type="button"
                    class="hud-button sleep-button"
                >
                    ☾
                    <span>SLEEP</span>
                </button>


                <button
                    id="renameBtn"
                    type="button"
                    class="hud-button rename-button"
                >
                    ✎
                    <span>NAME</span>
                </button>


                <button
                    id="resetBtn"
                    type="button"
                    class="hud-button reset-button"
                >
                    ↻
                    <span>RESET</span>
                </button>


            </div>

        </header>


        <!-- =================================================
             STATS HUD
        ================================================== -->

        <section class="stats-hud">


            <!-- HEALTH -->

            <div class="hud-stat">

                <div class="hud-stat-title">
                    ♥ HEALTH
                </div>

                <div class="pixel-bar">

                    <div
                        id="healthBar"
                        class="bar health"
                    ></div>

                </div>

                <strong id="healthValue">
                    82
                </strong>

            </div>


            <!-- HUNGER -->

            <div class="hud-stat">

                <div class="hud-stat-title">
                    ● HUNGER
                </div>

                <div class="pixel-bar">

                    <div
                        id="hungerBar"
                        class="bar hunger"
                    ></div>

                </div>

                <strong id="hungerValue">
                    68
                </strong>

            </div>


            <!-- LOVE -->

            <div class="hud-stat">

                <div class="hud-stat-title">
                    ♥ LOVE
                </div>

                <div class="pixel-bar">

                    <div
                        id="affectionBar"
                        class="bar affection"
                    ></div>

                </div>

                <strong id="affectionValue">
                    55
                </strong>

            </div>


            <!-- ENERGY -->

            <div class="hud-stat">

                <div class="hud-stat-title">
                    ★ ENERGY
                </div>

                <div class="pixel-bar">

                    <div
                        id="energyBar"
                        class="bar energy"
                    ></div>

                </div>

                <strong id="energyValue">
                    76
                </strong>

            </div>


            <!-- CLEANLINESS -->

            <div class="hud-stat">

                <div class="hud-stat-title">
                    ✧ CLEAN
                </div>

                <div class="pixel-bar">

                    <div
                        id="cleanlinessBar"
                        class="bar cleanliness"
                    ></div>

                </div>

                <strong id="cleanlinessValue">
                    75
                </strong>

            </div>


        </section>


        <!-- =================================================
             BUBBLES
        ================================================== -->

        <div class="bubble bubble1"></div>
        <div class="bubble bubble2"></div>
        <div class="bubble bubble3"></div>
        <div class="bubble bubble4"></div>
        <div class="bubble bubble5"></div>
        <div class="bubble bubble6"></div>


        <!-- =================================================
             CASTLE
        ================================================== -->

        <div class="castle">

            <div class="castle-top"></div>

            <div class="castle-body">

                <div class="castle-window"></div>

                <div class="castle-window"></div>

                <div class="castle-door"></div>

            </div>

        </div>


        <!-- =================================================
             PLANTS
        ================================================== -->

        <div class="plant plant-left">

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <div class="plant plant-right">

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>


        <!-- =================================================
             SAND
        ================================================== -->

        <div class="sand"></div>


        <!-- =================================================
             FISH
        ================================================== -->

        <div
            id="fish"
            class="fish-container"
            role="button"
            tabindex="0"
            aria-label="Pet your fish"
        >


            <!-- SHADOW -->

            <div class="fish-shadow"></div>


            <!-- PILLOW -->

            <div
                id="fishPillow"
                class="fish-pillow hidden"
            >

                <div class="pillow-detail"></div>

            </div>


            <!-- FISH -->

            <div class="fish">


                <!-- TAIL -->

                <div class="fish-tail"></div>


                <!-- BODY -->

                <div class="fish-body">


                    <!-- TOP FIN -->

                    <div class="fish-fin-top"></div>


                    <!-- BOTTOM FIN -->

                    <div class="fish-fin-bottom"></div>


                    <!-- EYE -->

                    <div class="fish-eye">

                        <span></span>

                    </div>


                    <!-- CHEEK -->

                    <div class="fish-cheek"></div>


                    <!-- SCALES -->

                    <div class="fish-scale scale1"></div>

                    <div class="fish-scale scale2"></div>

                    <div class="fish-scale scale3"></div>


                    <!-- MOUTH -->

                    <div
                        id="fishMouth"
                        class="fish-mouth"
                    ></div>

                </div>

            </div>


            <!-- BLANKET -->

            <div
                id="fishBlanket"
                class="fish-blanket hidden"
            >

                <div class="blanket-stripe"></div>
                <div class="blanket-stripe"></div>
                <div class="blanket-stripe"></div>

            </div>


        </div>


        <!-- =================================================
             SLEEP ZZZ
        ================================================== -->

        <div
            id="sleepZzz"
            class="sleep-zzz hidden"
        >
            Z
            <span>Z</span>
            <span>Z</span>
        </div>


        <!-- =================================================
             SPEECH BUBBLE
        ================================================== -->

        <div
            id="speech"
            class="speech"
        >
            HELLO!
        </div>


        <!-- =================================================
             FOOD TRAY
        ================================================== -->

        <div
            id="foodTray"
            class="food-tray hidden"
        >

            <div class="food-title">
                FOOD!
            </div>

            <div class="food-subtitle">
                PICK A SNACK
            </div>

            <div
                id="foodPieces"
                class="food-pieces"
            ></div>

        </div>


        <!-- =================================================
             FOOD MESSAGE
        ================================================== -->

        <div
            id="foodMessage"
            class="food-message hidden"
        >
            CHOOSE FOOD
        </div>


        <!-- =================================================
             PETTING HEARTS CONTAINER
        ================================================== -->

        <div
            id="heartContainer"
            class="heart-container"
        ></div>


        <!-- =================================================
             CARE MISSION
        ================================================== -->

        <div class="mission-hud">

            <div class="mission-title">
                TODAY'S CARE
            </div>

            <div class="mission-row">

                <span>
                    FOOD
                </span>

                <strong id="foodCount">
                    0 / 3
                </strong>

            </div>

            <div class="mission-row">

                <span>
                    LOVE
                </span>

                <strong id="loveCount">
                    0 / 3
                </strong>

            </div>

        </div>


        <!-- =================================================
             SLEEP WARNING
        ================================================== -->

        <div
            id="sleepWarning"
            class="sleep-warning hidden"
        >

            <span>
                ☾
            </span>

            <strong>
                I'M GETTING SLEEPY...
            </strong>

            <small>
                LET ME REST
            </small>

        </div>


        <!-- =================================================
             BOTTOM HELP
        ================================================== -->

        <div class="bottom-help">

            CLICK YOUR FISH TO PET ♥

        </div>


    </main>


    <!-- =================================================
         NAME MODAL
    ================================================== -->

    <div
        id="nameModal"
        class="modal hidden"
    >

        <div class="modal-box">

            <div class="modal-title">
                NAME YOUR FISH
            </div>

            <input
                id="nameInput"
                type="text"
                maxlength="12"
                value="BUBBLES"
            >

            <div class="modal-buttons">

                <button
                    id="cancelName"
                    type="button"
                >
                    CANCEL
                </button>

                <button
                    id="saveName"
                    type="button"
                >
                    OK!
                </button>

            </div>

        </div>

    </div>


    <!-- =================================================
         TOAST
    ================================================== -->

    <div
        id="toast"
        class="toast"
    ></div>


    <script src="game.js"></script>

</body>

</html>
